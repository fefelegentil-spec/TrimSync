<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />

  <title>Confidentialité — TrimSync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <style>
    :root {
      --bg:#07090b; --bg-raised:#0f1417; --bg-high:#1c1917;
      --border:#1c2a2e; --border-hi:#2c4146;
      --text:#eef4f5; --text-2:#a9bcc0; --text-3:#6c8286;
      --accent:#3bbfcc; --accent-lo:rgba(200,105,42,0.1);
      --font-serif:'Bricolage Grotesque',system-ui,sans-serif;
      --font-sans:'Figtree',system-ui,sans-serif;
      --max:1160px; --radius:6px;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased}
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    .nav{position:fixed;top:0;left:0;right:0;z-index:100;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);background:rgba(7,9,11,0.92);border-bottom:1px solid var(--border)}
    .nav-inner{max-width:var(--max);margin:0 auto;padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px}
    .nav-logo{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;letter-spacing:-0.03em;color:var(--text);text-decoration:none}
    .nav-logo span{color:var(--accent)}
    .nav-right{display:flex;align-items:center;gap:1rem}
    .lang-toggle{display:flex;align-items:center;gap:0.3rem;padding:0.35rem 0.65rem;border:1px solid var(--border);border-radius:var(--radius);font-size:0.8rem;color:var(--text-3);transition:border-color 0.2s,color 0.2s;background:transparent;cursor:pointer;font-family:inherit}
    .lang-toggle:hover{border-color:var(--border-hi);color:var(--text)}
    .nav-back{font-size:0.875rem;color:var(--text-3);display:flex;align-items:center;gap:0.4rem;transition:color 0.2s}
    .nav-back:hover{color:var(--text);text-decoration:none}
    .content{max-width:720px;margin:0 auto;padding:8rem 2rem 6rem}
    .content-header{margin-bottom:3.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
    .t-label{font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:0.8rem;display:block}
    h1{font-family:var(--font-serif);font-size:clamp(2.2rem,5vw,3.6rem);font-weight:600;letter-spacing:-0.02em;line-height:1.1;margin-bottom:1rem}
    .content-meta{font-size:0.85rem;color:var(--text-3)}
    h2{font-family:var(--font-serif);font-size:1.7rem;font-weight:600;line-height:1.2;letter-spacing:-0.01em;margin:2.8rem 0 1rem}
    h3{font-family:var(--font-serif);font-size:1.2rem;font-weight:600;margin:1.8rem 0 0.6rem}
    p{color:var(--text-2);margin-bottom:1.2rem;max-width:68ch;line-height:1.75}
    ul,ol{color:var(--text-2);padding-left:1.4rem;margin-bottom:1.2rem}
    ul li,ol li{margin-bottom:0.5rem;line-height:1.7}
    .contact-box{margin-top:2.4rem;padding:1.6rem 2rem;border:1px solid var(--border);background:var(--bg-raised);border-radius:var(--radius)}
    .contact-box p{margin:0}
    .contact-box a{color:var(--accent)}
    .footer-mini{border-top:1px solid var(--border);padding:2rem;text-align:center}
    .footer-mini a{color:var(--text-3);font-size:0.85rem;margin:0 0.8rem;transition:color 0.2s}
    .footer-mini a:hover{color:var(--text);text-decoration:none}
    .footer-mini p{font-size:0.8rem;color:var(--text-3);margin-top:1rem}
    .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:2.4rem 0}
    @media(max-width:600px){.content{padding:6rem 1.2rem 4rem}}
  </style>
</head>
<body>
<header class="nav">

        <span id="langFlag">🇫🇷</span><span id="langCode">FR</span>

      <a href="index.html" class="nav-back">

<main class="content">

  </div>
  <h2 data-en="1. Who is responsible" data-fr="1. Qui est responsable"></h2>
  <p data-en="Félix Lucas, sole trader (French micro-entreprise), trading as TrimSync — SIREN 929 257 731 — 23 rue de Keravel, 22300 Lannion, France. VAT not applicable, article 293 B of the French General Tax Code. Publication director: Félix Lucas. Contact: felix@trimsync.tech." data-fr="Félix Lucas, entrepreneur individuel (micro-entreprise), exerçant sous le nom commercial TrimSync — SIREN 929 257 731 — 23 rue de Keravel, 22300 Lannion, France. TVA non applicable, article 293 B du Code général des impôts. Directeur de la publication : Félix Lucas. Contact : felix@trimsync.tech."></p>
  <ul>
    <li data-en="For the data of salon owners (our customers): TrimSync is the data controller." data-fr="Pour les données des pros (nos clients) : TrimSync est responsable de traitement."></li>
    <li data-en="For the data of the salons&#x27; own clients (people who book or send a message): the salon is the data controller, TrimSync is its processor." data-fr="Pour les données des clients des salons (personnes qui réservent ou écrivent) : le salon est responsable de traitement, TrimSync est son sous-traitant."></li>
  </ul>

  <div class="divider"></div>

  <h2 data-en="2. Data we process" data-fr="2. Données traitées"></h2>
  <p data-en="Salon owners: email address, password (stored hashed), salon name, phone number, address, services, opening hours, subscription status. Card details are handled by Stripe only: TrimSync never sees them." data-fr="Pros : adresse email, mot de passe (stocké chiffré), nom du salon, téléphone, adresse, prestations, horaires, statut d&#x27;abonnement. Les données de carte bancaire sont traitées par Stripe uniquement : TrimSync ne les voit jamais."></p>
  <p data-en="Clients of the salons: first and last name, phone number, optional email address, appointments (date, time, service) and waitlist requests. If the salon activates the Instagram assistant: Instagram username and the content of direct messages, used only to answer and book." data-fr="Clients des salons : prénom et nom, téléphone, email facultatif, rendez-vous (date, heure, prestation) et inscriptions en liste d&#x27;attente. Si le salon active l&#x27;assistant Instagram : pseudo Instagram et contenu des messages directs, utilisés uniquement pour répondre et prendre rendez-vous."></p>
  <p data-en="No advertising, no profiling, no resale: the data is used only to run the booking service." data-fr="Aucune publicité, aucun profilage, aucune revente : les données servent uniquement à faire fonctionner la réservation."></p>

  <div class="divider"></div>

  <h2 data-en="3. Legal basis" data-fr="3. Base légale"></h2>
  <p data-en="Performance of the contract (providing the service to the salon and handling a booking), and legitimate interest for security and fraud prevention." data-fr="L&#x27;exécution du contrat (fournir le service au salon et traiter une réservation), et l&#x27;intérêt légitime pour la sécurité et la prévention des abus."></p>

  <div class="divider"></div>

  <h2 data-en="4. Service providers" data-fr="4. Prestataires"></h2>
  <ul>
    <li data-en="Cloudflare (website hosting) — United States" data-fr="Cloudflare (hébergement du site) — États-Unis"></li>
    <li data-en="Railway (application and database) — United States" data-fr="Railway (application et base de données) — États-Unis"></li>
    <li data-en="Stripe (payments) — Ireland / United States" data-fr="Stripe (paiements) — Irlande / États-Unis"></li>
    <li data-en="Resend (sending emails) — United States" data-fr="Resend (envoi des emails) — États-Unis"></li>
    <li data-en="Anthropic (AI assistant, only if activated) — United States; message content is not used to train models" data-fr="Anthropic (assistant IA, uniquement s&#x27;il est activé) — États-Unis ; le contenu des messages ne sert pas à entraîner les modèles"></li>
    <li data-en="Meta (Instagram messaging, only if activated)" data-fr="Meta (messagerie Instagram, uniquement si activée)"></li>
  </ul>
  <p data-en="Transfers outside the EU rely on the European Commission&#x27;s standard contractual clauses or the EU-US Data Privacy Framework." data-fr="Les transferts hors de l&#x27;Union européenne reposent sur les clauses contractuelles types de la Commission européenne ou le Data Privacy Framework UE–États-Unis."></p>

  <div class="divider"></div>

  <h2 data-en="5. Retention" data-fr="5. Conservation"></h2>
  <p data-en="Data is kept as long as the salon&#x27;s account exists. When a salon deletes its account from its settings, all its data — calendar, client files, messages — is deleted immediately. A client can at any time ask the salon, or TrimSync, to delete their data." data-fr="Les données sont conservées tant que le compte du salon existe. Quand un salon supprime son compte depuis ses paramètres, toutes ses données — agenda, fiches clients, messages — sont supprimées immédiatement. Un client peut à tout moment demander au salon, ou à TrimSync, la suppression de ses données."></p>

  <div class="divider"></div>

  <h2 data-en="6. Your rights" data-fr="6. Vos droits"></h2>
  <p data-en="You have the right to access, correct, delete, restrict and port your data, and to object to its processing. Write to felix@trimsync.tech; we answer within one month. You may also lodge a complaint with the CNIL (cnil.fr)." data-fr="Vous disposez d&#x27;un droit d&#x27;accès, de rectification, d&#x27;effacement, de limitation, de portabilité et d&#x27;opposition. Écrivez à felix@trimsync.tech ; nous répondons sous un mois. Vous pouvez aussi saisir la CNIL (cnil.fr)."></p>
  <p><a href="data-deletion.html" data-en="Data deletion instructions" data-fr="Instructions de suppression des données"></a></p>

  <div class="divider"></div>

  <h2 data-en="7. Cookies" data-fr="7. Cookies"></h2>
  <p data-en="TrimSync uses no advertising or tracking cookies. The browser&#x27;s local storage only keeps what the service needs (your session, your language, your last booking)." data-fr="TrimSync n&#x27;utilise aucun cookie publicitaire ni de mesure d&#x27;audience. Le stockage local du navigateur ne conserve que le nécessaire (ta session, ta langue, ta dernière réservation)."></p>

  <div class="divider"></div>

  <div class="contact-box">
    <p><span data-en="Questions?" data-fr="Une question ?"></span><br /><a href="mailto:felix@trimsync.tech">felix@trimsync.tech</a></p>

</main>

<script>
  const LANGS={en:{flag:'🇫🇷',code:'FR',next:'fr'},fr:{flag:'🇬🇧',code:'EN',next:'en'}};
  let cur=localStorage.getItem('ts-lang')||'fr';
  function applyLang(l){
    cur=l;localStorage.setItem('ts-lang',l);
    document.documentElement.lang=l;
    document.querySelectorAll('[data-en]').forEach(el=>{
      const v=el.getAttribute('data-'+l);if(!v)return;
      el.textContent=v;
    });
    document.getElementById('langFlag').textContent=LANGS[l].flag;
    document.getElementById('langCode').textContent=LANGS[l].code;
  }
  document.getElementById('langToggle').addEventListener('click',()=>applyLang(LANGS[cur].next));
  applyLang(cur);
</script>
</body>
