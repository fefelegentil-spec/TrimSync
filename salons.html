<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<style>html{background:#06070B}</style>
<meta name="theme-color" content="#06070B">
<title>Salons — Réservez en ligne avec TrimSync</title>
<meta name="description" content="L'annuaire des salons de beauté qui prennent leurs rendez-vous en ligne avec TrimSync. Ongles, coiffure, cils, esthétique : trouvez le tien et réserve en deux clics.">
<meta property="og:type" content="website">
<meta property="og:title" content="Salons — Réservez en ligne avec TrimSync">
<meta property="og:description" content="Ongles, coiffure, cils, esthétique : trouve ton salon et réserve en deux clics.">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
/* ── Annuaire TrimSync — même identité que la page de réservation ── */
:root{
  color-scheme:dark;
  --bg:#06070B;--bg-2:#0B0D13;--bg-3:#12151D;
  --border:rgba(255,255,255,.07);--border-2:rgba(255,255,255,.13);
  --accent-rgb:96,196,200;
  --accent:rgb(var(--accent-rgb));
  --grad-accent:linear-gradient(135deg,#2A9EA3,#60C4C8 50%,#9ADDE1);
  --text:#EEF1F5;--text-2:#A9AFBA;--text-3:#7A808C;
  --fd:'Bricolage Grotesque',sans-serif;--fb:'Figtree',sans-serif;
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-font-smoothing:antialiased}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.55;min-height:100vh;overflow-x:hidden;overflow-x:clip}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background-image:radial-gradient(ellipse at 50% -10%,rgba(var(--accent-rgb),.07),transparent 55%)}
a{color:inherit;text-decoration:none}
main{position:relative;z-index:1;max-width:880px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top,0px)) 20px calc(60px + env(safe-area-inset-bottom,0px))}
.tete{text-align:center;margin-bottom:30px}
.marque{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.02em;margin-bottom:18px}
.marque .tuile{width:30px;height:30px;border-radius:9px;background:var(--grad-accent);display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#05191B;box-shadow:0 4px 14px rgba(var(--accent-rgb),.3)}
.marque span b{color:var(--accent)}
h1{font-family:var(--fd);font-size:clamp(24px,5.4vw,34px);font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.sous{color:var(--text-2);max-width:520px;margin:0 auto}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.carte-salon{
  display:flex;flex-direction:column;gap:10px;padding:18px;
  background:var(--bg-2);border:1px solid var(--border);border-radius:16px;
  transition:border-color .2s var(--ease),transform .15s var(--ease),box-shadow .2s var(--ease);
}
.carte-salon:hover{border-color:rgba(var(--accent-rgb),.5);transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.monogramme{
  width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  font-family:var(--fd);font-size:17px;font-weight:800;color:#05191B;letter-spacing:-.5px;
  background:var(--monogramme,var(--grad-accent));box-shadow:0 6px 18px rgba(var(--accent-rgb),.22);
}
.nom{font-family:var(--fd);font-size:16px;font-weight:800;letter-spacing:-.01em}
.ville{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text-3)}
.ville i{font-size:13px}
.prestas{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.presta{font-size:11px;font-weight:600;color:var(--text-2);background:var(--bg-3);border:1px solid var(--border-2);border-radius:20px;padding:3px 10px}
.reserver{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-size:12.5px;font-weight:800;color:var(--accent)}
.reserver i{transition:transform .2s var(--ease)}
.carte-salon:hover .reserver i{transform:translateX(3px)}
.vide{text-align:center;color:var(--text-3);padding:50px 0;grid-column:1/-1}
.vide i{font-size:34px;display:block;margin-bottom:10px;color:var(--accent)}
.pied{margin-top:34px;text-align:center;font-size:12px;color:var(--text-3)}
.pied a{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main>
  <div class="tete">
    <div class="marque"><span class="tuile">TS</span><span>Trim<b>Sync</b></span></div>
    <h1>Réservez directement chez votre salon</h1>
    <p class="sous">Tous ces salons prennent leurs rendez-vous en ligne, 24 h/24. Choisis ton salon, prends ton créneau : c'est confirmé tout de suite.</p>
  </div>
  <div class="grille" id="liste"><div class="vide"><i class="ti ti-loader-2"></i>Chargement…</div></div>
  <p class="pied">Tu es pro de la beauté ? <a href="https://trimsync.tech">Propose la réservation en ligne à tes clients avec TrimSync</a></p>
</main>
<script>
(async function(){
  // Le backend vit sur Railway : même origine API que la page de réservation.
  const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
    ? (localStorage.getItem('ts_api') || 'http://localhost:3998')
    : 'https://trimsync-production.up.railway.app';
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const liste = document.getElementById('liste');
  try {
    const r = await fetch(API + '/api/public/annuaire');
    const { salons } = await r.json();
    if (!salons.length) {
      liste.innerHTML = '<div class="vide"><i class="ti ti-calendar-off"></i>Aucun salon pour le moment — reviens vite.</div>';
      return;
    }
    liste.innerHTML = salons.map(s => {
      const mono = s.nom.trim().split(/\s+/).slice(0, 2).map(w => (w[0] || '').toUpperCase()).join('');
      const teinte = /^#([0-9a-f]{6})$/i.exec(s.couleur || '')
        ? `--monogramme:linear-gradient(135deg, color-mix(in srgb, ${esc(s.couleur)} 70%, #000), ${esc(s.couleur)})` : '';
      return `<a class="carte-salon" href="/r/${esc(s.slug)}">
        <div class="monogramme" style="${teinte}">${esc(mono)}</div>
        <div><div class="nom">${esc(s.nom)}</div>
        ${s.ville ? `<div class="ville"><i class="ti ti-map-pin"></i>${esc(s.ville)}</div>` : ''}</div>
        ${s.prestations && s.prestations.length ? `<div class="prestas">${s.prestations.map(p => `<span class="presta">${esc(p)}</span>`).join('')}</div>` : ''}
        <span class="reserver">Réserver en ligne<i class="ti ti-arrow-right"></i></span>
      </a>`;
    }).join('');
  } catch (e) {
    liste.innerHTML = '<div class="vide"><i class="ti ti-wifi-off"></i>Impossible de charger l&#39;annuaire. Réessaie dans un instant.</div>';
  }
})();
</script>
</body>
</html>
