    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    .nav-back:hover{color:var(--text);text-decoration:none}
    .content{max-width:720px;margin:0 auto;padding:8rem 2rem 6rem}
    .content-header{margin-bottom:3.5rem;padding-bottom:2rem;border-bottom:1px solid var(--border)}
    .t-label{font-family:var(--font-sans);font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent);margin-bottom:0.8rem;display:block}

<script>
  const LANGS={en:{flag:'🇫🇷',code:'FR',next:'fr'},fr:{flag:'🇬🇧',code:'EN',next:'en'}};
  let cur=localStorage.getItem('ts-lang')||'fr';
  function applyLang(l){
    cur=l;localStorage.setItem('ts-lang',l);
    document.documentElement.lang=l;
    document.querySelectorAll('[data-en]').forEach(el=>{
      const v=el.getAttribute('data-'+l);if(!v)return;
      el.textContent=v;
    });
    document.getElementById('langFlag').textContent=LANGS[l].flag;
    document.getElementById('langCode').textContent=LANGS[l].code;
  }
  document.getElementById('langToggle').addEventListener('click',()=>applyLang(LANGS[cur].next));
  applyLang(cur);
</script>
